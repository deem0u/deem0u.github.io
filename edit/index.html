<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Your Contact Information</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="app-header-inner">
        <div class="app-logo">
          <div class="app-logo-icon">C</div>
          <span class="app-logo-text">Contact Editor</span>
        </div>
      </div>
    </header>

    <main id="screen-auth" class="app-centered">
      <div class="auth-card">
        <div class="auth-header">
          <h1 class="auth-title">Access Your Page</h1>
          <p class="auth-subtitle">Enter your edit key to update your contact information</p>
        </div>
        <form id="auth-form">
          <div class="form-group">
            <label class="form-label">Edit Key</label>
            <input type="password" id="edit-key" class="form-input" placeholder="Enter your edit key" required>
            <span class="form-hint">This was provided to you via email</span>
          </div>
          <div id="auth-alert" class="alert"></div>
          <button type="submit" class="btn btn-primary btn-block btn-lg">Continue</button>
        </form>
      </div>
    </main>

    <main id="screen-editor" class="app-main hidden">
      <div class="app-container">
        <div class="card" style="background: var(--blue-50); border-color: var(--blue-100); margin-bottom: var(--space-6);">
          <div class="card-body" style="padding: var(--space-4) var(--space-5);">
            <p style="margin: 0; font-size: var(--text-sm); color: var(--blue-700);">
              Welcome, <strong id="user-name">User</strong>. Update your information below and click Save.
            </p>
          </div>
        </div>

        <div class="card">
          <div class="card-header"><span class="card-title">Your Contact Details</span></div>
          <div class="card-body">
            <form id="contact-form">
              <div class="form-row">
                <div class="form-group"><label class="form-label">First Name</label><input type="text" id="first-name" class="form-input" required></div>
                <div class="form-group"><label class="form-label">Surname</label><input type="text" id="surname" class="form-input" required></div>
              </div>
              <div class="form-row">
                <div class="form-group"><label class="form-label">Email</label><input type="email" id="email" class="form-input" required></div>
                <div class="form-group"><label class="form-label">Mobile</label><input type="tel" id="mobile" class="form-input" placeholder="+61 xxx xxx xxx" required></div>
              </div>
              <div class="form-group"><label class="form-label">Home Country</label><input type="text" id="home-country" class="form-input" required></div>
              <div class="form-group">
                <label class="form-label">Destination Details <span class="form-label-optional">(optional)</span></label>
                <div class="form-section">
                  <div class="form-group"><label class="form-label">Location Name</label><input type="text" id="dest-name" class="form-input"></div>
                  <div class="form-row">
                    <div class="form-group"><label class="form-label">Phone</label><input type="tel" id="dest-phone" class="form-input"></div>
                    <div class="form-group"><label class="form-label">Email</label><input type="email" id="dest-email" class="form-input"></div>
                  </div>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">Additional Information <span class="form-label-optional">(optional)</span></label>
                <textarea id="additional-info" class="form-textarea" rows="3" placeholder="Any extra details you want shown on the contact page"></textarea>
                <span class="form-hint">Shown on the contact page for airport staff</span>
              </div>
              <div id="editor-alert" class="alert"></div>
              <div class="form-actions">
                <button type="submit" id="save-btn" class="btn btn-primary btn-lg">Save Changes</button>
                <button type="button" class="btn btn-secondary" onclick="resetForm()">Reset</button>
              </div>
            </form>
          </div>
          <div class="card-footer" style="display: flex; justify-content: flex-end;">
            <a id="view-page-link" href="#" target="_blank" class="btn btn-secondary">View Page →</a>
          </div>
        </div>
      </div>
    </main>
  </div>

<script>
const API = 'https://contact-page-editor.deem0u.workers.dev';
let folder = null, editKey = null, currentSha = null;

document.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  folder = params.get('folder');
  const urlKey = params.get('key');
  
  // Always attach form handlers
  document.getElementById('auth-form').addEventListener('submit', (e) => { e.preventDefault(); authenticate(); });
  document.getElementById('contact-form').addEventListener('submit', handleSave);
  
  // Check if folder parameter exists
  if (!folder) { 
    showAlert('auth-alert', 'Invalid link. Please check your email for the correct link.', 'error'); 
    document.getElementById('edit-key').disabled = true;
    document.querySelector('#auth-form button[type="submit"]').disabled = true;
    return; 
  }
  
  // Auto-authenticate if key is in URL
  if (urlKey) { 
    document.getElementById('edit-key').value = urlKey; 
    authenticate(); 
  }
});

async function authenticate() {
  editKey = document.getElementById('edit-key').value.trim();
  if (!editKey) { showAlert('auth-alert', 'Please enter your edit key', 'error'); return; }
  if (!folder) { showAlert('auth-alert', 'Invalid link. Missing folder parameter.', 'error'); return; }
  
  showAlert('auth-alert', '<span class="spinner"></span> Verifying...', 'info');
  
  try {
    const res = await fetch(`${API}/api/page/${folder}`, { headers: { 'X-Edit-Key': editKey } });
    if (!res.ok) { showAlert('auth-alert', 'Invalid edit key. Please check and try again.', 'error'); return; }
    
    const data = await res.json();
    currentSha = data.sha;
    fillForm(data.content);
    
    document.getElementById('user-name').textContent = document.getElementById('first-name').value || folder;
    document.getElementById('view-page-link').href = `https://deem0u.github.io/${folder}/`;
    document.getElementById('screen-auth').classList.add('hidden');
    document.getElementById('screen-editor').classList.remove('hidden');
  } catch (e) { 
    console.error('Auth error:', e);
    showAlert('auth-alert', 'Connection error. Please try again.', 'error'); 
  }
}

function fillForm(h) {
  // New HTML structure: <span class="label">Name</span><span class="value">John</span>
  const g = l => { 
    const m = h.match(new RegExp(`<span class="label">${l}</span><span class="value">([^<]+)</span>`)); 
    return m ? m[1].trim() : ''; 
  };
  const decodeHtmlEntities = (s) => (s ?? '')
    .toString()
    .replace(/&nbsp;/g, ' ')
    .replace(/&#39;/g, "'")
    .replace(/&quot;/g, '"')
    .replace(/&gt;/g, '>')
    .replace(/&lt;/g, '<')
    .replace(/&amp;/g, '&');

  const decodeMultiline = (s) => {
    const raw = (s ?? '').toString().trim();
    if (!raw || raw === '—') return '';
    return decodeHtmlEntities(raw)
      .replace(/<br\s*\/?>/gi, '\n')
      .replace(/<[^>]*>/g, '');
  };

  const gMulti = l => {
    const m = h.match(new RegExp(`<span class="label">${l}</span><span class="value">([\\s\\S]*?)</span>`));
    return m ? decodeMultiline(m[1]) : '';
  };
  // For links: <span class="label">Email</span><span class="value"><a href="...">email@example.com</a></span>
  const gl = l => { 
    const m = h.match(new RegExp(`<span class="label">${l}</span><span class="value"><a[^>]*>([^<]+)</a></span>`)); 
    return m ? m[1].trim() : ''; 
  };
  
  document.getElementById('first-name').value = g('Name');
  document.getElementById('surname').value = g('Surname');
  document.getElementById('email').value = gl('Email');
  document.getElementById('mobile').value = gl('Mobile');
  document.getElementById('home-country').value = g('Home Country');
  
  // Destination details: <div class="dest-details"><span>Name</span><span>Phone</span><span>Email</span></div>
  const dm = h.match(/<div class="dest-details"><span>([^<]*)<\/span><span>([^<]*)<\/span><span>([^<]*)<\/span><\/div>/);
  document.getElementById('dest-name').value = dm ? dm[1].trim() : '';
  document.getElementById('dest-phone').value = dm ? dm[2].trim() : '';
  document.getElementById('dest-email').value = dm ? dm[3].trim() : '';

  document.getElementById('additional-info').value = gMulti('Additional Information');
}

async function resetForm() {
  showAlert('editor-alert', '<span class="spinner"></span> Reloading...', 'info');
  try {
    const res = await fetch(`${API}/api/page/${folder}`, { headers: { 'X-Edit-Key': editKey } });
    if (res.ok) { const d = await res.json(); currentSha = d.sha; fillForm(d.content); hideAlert('editor-alert'); }
  } catch (e) { showAlert('editor-alert', 'Failed to reload', 'error'); }
}

async function handleSave(e) {
  e.preventDefault();
  const btn = document.getElementById('save-btn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Saving...';
  
  try {
    const content = generateHTML();
    const res = await fetch(`${API}/api/page/${folder}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Edit-Key': editKey },
      body: JSON.stringify({ content, sha: currentSha })
    });
    const data = await res.json();
    
    if (res.ok) {
      currentSha = data.sha;
      document.getElementById('user-name').textContent = document.getElementById('first-name').value;
      showAlert('editor-alert', 'Changes saved successfully! Use the "View Page" button below to see your updates.', 'success');
    } else { showAlert('editor-alert', data.error || 'Failed to save', 'error'); }
  } catch (e) { showAlert('editor-alert', 'Connection error', 'error'); }
  finally { btn.disabled = false; btn.textContent = 'Save Changes'; }
}

function generateHTML() {
  const f = i => document.getElementById(i).value.trim();
  const ml = f('mobile').replace(/\s/g, '');
  const firstName = f('first-name');
  const surname = f('surname');
  const email = f('email');
  const mobile = f('mobile');
  const homeCountry = f('home-country');
  const destName = f('dest-name');
  const destPhone = f('dest-phone');
  const destEmail = f('dest-email');
  const additionalInfo = f('additional-info');

  const escapeHtml = (s) => (s ?? '')
    .toString()
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');

  const formatMultiline = (s) => {
    const text = (s ?? '').toString().trim();
    if (!text) return '';
    return escapeHtml(text).replace(/\r?\n/g, '<br>');
  };
  
  const css = `
    *{box-sizing:border-box;margin:0;padding:0}
    html{font-size:16px;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,"Helvetica Neue",Arial,sans-serif,"Apple Color Emoji","Segoe UI Emoji";line-height:1.7;color:#1a1a1a;background:#fff;padding:24px;min-height:100vh}
    .container{max-width:600px;margin:0 auto;padding:32px 24px;background:#fff}
    @media(min-width:640px){.container{padding:48px 40px}}
    h1{font-size:1.5rem;font-weight:700;color:#111;margin-bottom:24px;padding-bottom:16px;border-bottom:3px solid #111;letter-spacing:-0.025em;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px}
    @media(min-width:640px){h1{font-size:1.75rem}}
    .last-updated-header{font-size:0.7rem;font-weight:400;color:#6b7280;margin-left:auto;line-height:1.4;text-align:right;min-width:0;flex-shrink:0;max-width:100%;padding-top:2px}
    @media(min-width:640px){.last-updated-header{font-size:0.75rem}}
    .last-updated-header .last-updated-display{display:block;margin-top:2px;word-break:break-word;overflow-wrap:break-word}
    .section-zh h1{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px}
    .section-zh h1 .last-updated-header{padding-top:2px}
    .info{display:flex;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid #e5e7eb;gap:16px 24px}
    .info.additional-info{flex-direction:column;align-items:flex-start;gap:6px}
    .info:last-of-type{border-bottom:none}
    .label{font-weight:600;color:#374151;min-width:140px;flex-shrink:0}
    .value{color:#1a1a1a;word-break:break-word}
    a{color:#2563eb;text-decoration:none;transition:color 0.15s}
    a:hover{color:#1d4ed8;text-decoration:underline}
    a:active{color:#1e40af}
    .divider{margin:48px 0;border:none;border-top:3px solid #d1d5db;max-width:80%;margin-left:auto;margin-right:auto}
    @media(min-width:640px){.divider{margin:64px 0;max-width:70%}}
    .section-zh{color:#1a1a1a;margin-top:8px}
    .section-zh h1{font-size:1.375rem;border-color:#111}
    @media(min-width:640px){.section-zh h1{font-size:1.5rem}}
    .dest-details{display:flex;flex-direction:column;gap:4px;color:#1a1a1a}
    @media print{body{padding:0;background:#fff}.container{padding:20px;max-width:100%}a{color:#1a1a1a}h1{border-bottom-width:2px}}
  `.replace(/\n\s*/g, '');
  
  const formatTimestampScript = `
<script>
(function() {
  function formatTimestamp(isoString, updatedBy) {
    if (!isoString) return '';
    var date = new Date(isoString);
    var dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    var monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    var dayName = dayNames[date.getDay()];
    var day = date.getDate();
    var month = monthNames[date.getMonth()];
    var year = date.getFullYear();
    var hours = String(date.getHours()).padStart(2, '0');
    var minutes = String(date.getMinutes()).padStart(2, '0');
    var tzParts = Intl.DateTimeFormat('en', { timeZoneName: 'short' }).formatToParts(date);
    var tzPart = tzParts.find(function(p) { return p.type === 'timeZoneName'; });
    var tz = tzPart ? tzPart.value : '';
    var by = updatedBy === 'admin' ? 'Admin' : 'User';
    return tz ? dayName + ', ' + day + ' ' + month + ' ' + year + ' ' + hours + ':' + minutes + ' ' + tz + ' by ' + by : dayName + ', ' + day + ' ' + month + ' ' + year + ' ' + hours + ':' + minutes + ' by ' + by;
  }
  document.querySelectorAll('.last-updated-display').forEach(function(el) {
    var timestamp = el.getAttribute('data-timestamp');
    var updatedBy = el.getAttribute('data-updated-by');
    if (timestamp) {
      el.textContent = formatTimestamp(timestamp, updatedBy);
    }
  });
})();
</scr` + `ipt>`;
  
  const destHtml = (destName || destPhone || destEmail) 
    ? `<div class="dest-details"><span>${destName || ''}</span><span>${destPhone || ''}</span><span>${destEmail || ''}</span></div>`
    : '<span class="value">—</span>';

  const additionalHtml = additionalInfo ? `<span class="value">${formatMultiline(additionalInfo)}</span>` : '<span class="value">—</span>';
  
  // Store ISO timestamp and updatedBy in data attributes for client-side formatting
  const now = new Date().toISOString();
  const lastUpdatedData = `data-timestamp="${now}" data-updated-by="user"`;
  const lastUpdatedHeaderHtml = `<span class="last-updated-header">Last updated:<br><span class="last-updated-display" ${lastUpdatedData}>—</span></span>`;

  return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0">
<meta name="format-detection" content="telephone=yes">
<meta name="theme-color" content="#ffffff">
<title>Contact - ${firstName} ${surname}</title>
<style>${css}</style>
</head>
<body>
<div class="container">
<h1>Contact Information${lastUpdatedHeaderHtml}</h1>
<div class="info"><span class="label">Name</span><span class="value">${firstName}</span></div>
<div class="info"><span class="label">Surname</span><span class="value">${surname}</span></div>
<div class="info"><span class="label">Email</span><span class="value"><a href="mailto:${email}">${email}</a></span></div>
<div class="info"><span class="label">Mobile</span><span class="value"><a href="tel:${ml}">${mobile}</a></span></div>
<div class="info"><span class="label">Home Country</span><span class="value">${homeCountry}</span></div>
<div class="info"><span class="label">Destination Details</span>${destHtml}</div>
<div class="info additional-info"><span class="label">Additional Information</span>${additionalHtml}</div>
<hr class="divider">
<section class="section-zh">
<h1>联系信息${lastUpdatedHeaderHtml}</h1>
<div class="info"><span class="label">名字</span><span class="value">${firstName}</span></div>
<div class="info"><span class="label">姓氏</span><span class="value">${surname}</span></div>
<div class="info"><span class="label">电子邮件</span><span class="value"><a href="mailto:${email}">${email}</a></span></div>
<div class="info"><span class="label">手机</span><span class="value"><a href="tel:${ml}">${mobile}</a></span></div>
<div class="info"><span class="label">所属国家</span><span class="value">${homeCountry}</span></div>
<div class="info"><span class="label">目的地详情</span>${destHtml}</div>
<div class="info additional-info"><span class="label">补充信息</span>${additionalHtml}</div>
</section>
</div>
${formatTimestampScript}
</body>
</html>`;
}

function showAlert(id, msg, type) { const e = document.getElementById(id); e.className = `alert alert-${type} show`; e.innerHTML = `<div class="alert-content">${msg}</div>`; }
function hideAlert(id) { document.getElementById(id).className = 'alert'; }
</script>
</body>
</html>
