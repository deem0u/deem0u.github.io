<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Your Contact Information</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="app-header-inner">
        <div class="app-logo">
          <div class="app-logo-icon">C</div>
          <span class="app-logo-text">Contact Editor</span>
        </div>
      </div>
    </header>

    <main id="screen-auth" class="app-centered">
      <div class="auth-card">
        <div class="auth-header">
          <h1 class="auth-title">Access Your Page</h1>
          <p class="auth-subtitle">Enter your edit key to update your contact information</p>
        </div>
        <form id="auth-form">
          <div class="form-group">
            <label class="form-label">Edit Key</label>
            <input type="password" id="edit-key" class="form-input" placeholder="Enter your edit key" required>
            <span class="form-hint">This was provided to you via email</span>
          </div>
          <div id="auth-alert" class="alert"></div>
          <button type="submit" class="btn btn-primary btn-block btn-lg">Continue</button>
        </form>
      </div>
    </main>

    <main id="screen-editor" class="app-main hidden">
      <div class="app-container">
        <div class="card" style="background: var(--blue-50); border-color: var(--blue-100); margin-bottom: var(--space-6);">
          <div class="card-body" style="padding: var(--space-4) var(--space-5);">
            <p style="margin: 0; font-size: var(--text-sm); color: var(--blue-700);">
              Welcome, <strong id="user-name">User</strong>. Update your information below and click Save.
            </p>
          </div>
        </div>

        <div class="card">
          <div class="card-header"><span class="card-title">Your Contact Details</span></div>
          <div class="card-body">
            <form id="contact-form">
              <div class="form-row">
                <div class="form-group"><label class="form-label">First Name</label><input type="text" id="first-name" class="form-input" required></div>
                <div class="form-group"><label class="form-label">Surname</label><input type="text" id="surname" class="form-input" required></div>
              </div>
              <div class="form-row">
                <div class="form-group"><label class="form-label">Email</label><input type="email" id="email" class="form-input" required></div>
                <div class="form-group"><label class="form-label">Mobile</label><input type="tel" id="mobile" class="form-input" placeholder="+61 xxx xxx xxx" required></div>
              </div>
              <div class="form-group"><label class="form-label">Home Country</label><input type="text" id="home-country" class="form-input" required></div>
              <div class="form-group">
                <label class="form-label">Destination Details <span class="form-label-optional">(optional)</span></label>
                <div class="form-section">
                  <div class="form-group"><label class="form-label">Location Name</label><input type="text" id="dest-name" class="form-input"></div>
                  <div class="form-row">
                    <div class="form-group"><label class="form-label">Phone</label><input type="tel" id="dest-phone" class="form-input"></div>
                    <div class="form-group"><label class="form-label">Email</label><input type="email" id="dest-email" class="form-input"></div>
                  </div>
                </div>
              </div>
              <div id="editor-alert" class="alert"></div>
              <div class="form-actions">
                <button type="submit" id="save-btn" class="btn btn-primary btn-lg">Save Changes</button>
                <button type="button" class="btn btn-secondary" onclick="resetForm()">Reset</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>

<script>
const API = 'https://contact-page-editor.deem0u.workers.dev';
let folder = null, editKey = null, currentSha = null;

document.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  folder = params.get('folder');
  const urlKey = params.get('key');
  
  if (!folder) { showAlert('auth-alert', 'Invalid link. Please check your email for the correct link.', 'error'); return; }
  if (urlKey) { document.getElementById('edit-key').value = urlKey; authenticate(); }
  
  document.getElementById('auth-form').addEventListener('submit', (e) => { e.preventDefault(); authenticate(); });
  document.getElementById('contact-form').addEventListener('submit', handleSave);
});

async function authenticate() {
  editKey = document.getElementById('edit-key').value.trim();
  if (!editKey) { showAlert('auth-alert', 'Please enter your edit key', 'error'); return; }
  
  showAlert('auth-alert', '<span class="spinner"></span> Verifying...', 'info');
  
  try {
    const res = await fetch(`${API}/api/page/${folder}`, { headers: { 'X-Edit-Key': editKey } });
    if (!res.ok) { showAlert('auth-alert', 'Invalid edit key. Please check and try again.', 'error'); return; }
    
    const data = await res.json();
    currentSha = data.sha;
    fillForm(data.content);
    
    document.getElementById('user-name').textContent = document.getElementById('first-name').value || folder;
    document.getElementById('screen-auth').classList.add('hidden');
    document.getElementById('screen-editor').classList.remove('hidden');
  } catch (e) { showAlert('auth-alert', 'Connection error. Please try again.', 'error'); }
}

function fillForm(h) {
  const g = l => { const m = h.match(new RegExp(`<span class="label">${l}:</span>\\s*([^<]+)`)); return m ? m[1].trim() : ''; };
  const gl = l => { const m = h.match(new RegExp(`<span class="label">${l}:</span>.*?<a[^>]*>([^<]+)</a>`, 's')); return m ? m[1].trim() : ''; };
  document.getElementById('first-name').value = g('Name');
  document.getElementById('surname').value = g('Surname');
  document.getElementById('email').value = gl('Email');
  document.getElementById('mobile').value = gl('Mobile');
  document.getElementById('home-country').value = g('Home Country');
  const dm = h.match(/<span class="label">Destination Details:<\/span>\s*<br>([^<]*)<br>([^<]*)<br>([^<]*)/);
  document.getElementById('dest-name').value = dm ? dm[1].trim() : '';
  document.getElementById('dest-phone').value = dm ? dm[2].trim() : '';
  document.getElementById('dest-email').value = dm ? dm[3].trim() : '';
}

async function resetForm() {
  showAlert('editor-alert', '<span class="spinner"></span> Reloading...', 'info');
  try {
    const res = await fetch(`${API}/api/page/${folder}`, { headers: { 'X-Edit-Key': editKey } });
    if (res.ok) { const d = await res.json(); currentSha = d.sha; fillForm(d.content); hideAlert('editor-alert'); }
  } catch (e) { showAlert('editor-alert', 'Failed to reload', 'error'); }
}

async function handleSave(e) {
  e.preventDefault();
  const btn = document.getElementById('save-btn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Saving...';
  
  try {
    const content = generateHTML();
    const res = await fetch(`${API}/api/page/${folder}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Edit-Key': editKey },
      body: JSON.stringify({ content, sha: currentSha })
    });
    const data = await res.json();
    
    if (res.ok) {
      currentSha = data.sha;
      document.getElementById('user-name').textContent = document.getElementById('first-name').value;
      showAlert('editor-alert', `Changes saved! <a href="${data.url}" target="_blank">View your page →</a>`, 'success');
    } else { showAlert('editor-alert', data.error || 'Failed to save', 'error'); }
  } catch (e) { showAlert('editor-alert', 'Connection error', 'error'); }
  finally { btn.disabled = false; btn.textContent = 'Save Changes'; }
}

function generateHTML() {
  const f = i => document.getElementById(i).value.trim(), ml = f('mobile').replace(/\s/g, '');
  return `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Contact - ${f('first-name')} ${f('surname')}</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.6;max-width:600px;margin:40px auto;padding:20px;color:#333}h1{margin-bottom:24px;padding-bottom:12px;border-bottom:2px solid #333;font-size:24px}.info{margin:14px 0}.label{font-weight:600}a{color:#2563eb;text-decoration:none}hr{margin:48px 0;border:none;border-top:1px solid #e5e7eb}</style></head><body><h1>Contact Information</h1><div class="info"><span class="label">Name:</span> ${f('first-name')}</div><div class="info"><span class="label">Surname:</span> ${f('surname')}</div><div class="info"><span class="label">Email:</span> <a href="mailto:${f('email')}">${f('email')}</a></div><div class="info"><span class="label">Mobile:</span> <a href="tel:${ml}">${f('mobile')}</a></div><div class="info"><span class="label">Home Country:</span> ${f('home-country')}</div><div class="info"><span class="label">Destination Details:</span> <br>${f('dest-name')} <br>${f('dest-phone')} <br>${f('dest-email')}</div><hr><section><h1>联系信息</h1><div class="info"><span class="label">名字：</span> ${f('first-name')}</div><div class="info"><span class="label">姓氏：</span> ${f('surname')}</div><div class="info"><span class="label">电子邮件：</span> <a href="mailto:${f('email')}">${f('email')}</a></div><div class="info"><span class="label">手机：</span> <a href="tel:${ml}">${f('mobile')}</a></div><div class="info"><span class="label">所属国家：</span> ${f('home-country')==='Australia'?'澳大利亚':f('home-country')}</div><div class="info"><span class="label">目的地详情：</span> <br>${f('dest-name')} <br>${f('dest-phone')} <br>${f('dest-email')}</div></section></body></html>`;
}

function showAlert(id, msg, type) { const e = document.getElementById(id); e.className = `alert alert-${type} show`; e.innerHTML = `<div class="alert-content">${msg}</div>`; }
function hideAlert(id) { document.getElementById(id).className = 'alert'; }
</script>
</body>
</html>
