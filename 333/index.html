<script>
(function() {
  function formatTimestamp(isoString, updatedBy) {
    if (!isoString) return '';
    var date = new Date(isoString);
    var dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    var monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    var dayName = dayNames[date.getDay()];
    var day = date.getDate();
    var month = monthNames[date.getMonth()];
    var year = date.getFullYear();
    var hours = String(date.getHours()).padStart(2, '0');
    var minutes = String(date.getMinutes()).padStart(2, '0');
    var tzParts = Intl.DateTimeFormat('en', { timeZoneName: 'short' }).formatToParts(date);
    var tzPart = tzParts.find(function(p) { return p.type === 'timeZoneName'; });
    var tz = tzPart ? tzPart.value : '';
    var by = updatedBy === 'admin' ? 'Admin' : 'User';
    return tz ? dayName + ', ' + day + ' ' + month + ' ' + year + ' ' + hours + ':' + minutes + ' ' + tz + ' by ' + by : dayName + ', ' + day + ' ' + month + ' ' + year + ' ' + hours + ':' + minutes + ' by ' + by;
  }
  document.querySelectorAll('.last-updated-display').forEach(function(el) {
    var timestamp = el.getAttribute('data-timestamp');
    var updatedBy = el.getAttribute('data-updated-by');
    if (timestamp) {
      el.textContent = formatTimestamp(timestamp, updatedBy);
    }
  });
})();
</script>
