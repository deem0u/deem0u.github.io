<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Digital Contact Information Page</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
  .app-nav.tabs { margin-bottom: 0; }
  .app-nav.tabs .tab { flex: none; text-decoration: none; display: inline-block; }
  .contact-form-card { max-width: 520px; margin: 0 auto; }
  .contact-form-card .card-title { font-size: 1.5rem; }
  .contact-confirm { display: none; padding: 1.25rem; margin-top: 1rem; border-radius: var(--radius-md, 0.5rem); }
  .contact-confirm.success { background: var(--color-success-bg, #dcfce7); color: var(--color-success-text, #166534); border: 1px solid var(--color-success, #16a34a); }
  .contact-confirm.error { background: var(--color-error-bg, #fef2f2); color: var(--color-error-text, #991b1b); border: 1px solid var(--color-error, #dc2626); }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="app-header-inner">
        <div class="app-logo">
          <div class="app-logo-icon">C</div>
          <span class="app-logo-text">Digital Contact Information Page</span>
        </div>
        <nav class="app-nav tabs">
          <a href="/home/" class="tab">Home</a>
          <a href="https://deem0u.github.io/myaccount/" class="tab">My Account</a>
          <a href="/terms-and-privacy/" class="tab">Terms of Use & Privacy</a>
          <a href="/contact/" class="tab active">Contact</a>
        </nav>
      </div>
    </header>

    <main class="app-main">
      <div class="app-container" style="padding: 2rem 1rem;">
        <div class="card contact-form-card">
          <div class="card-header">
            <span class="card-title">Contact us</span>
          </div>
          <div class="card-body">
            <p class="text-secondary" style="margin-bottom: 1.25rem;">Send a message and we’ll get back to you as soon as we can.</p>

            <div id="contact-form-wrap">
              <form id="contact-form">
                <div class="form-group">
                  <label class="form-label" for="contact-name">Name <span class="form-required">*</span></label>
                  <input type="text" id="contact-name" name="name" class="form-input" required maxlength="120" autocomplete="name" placeholder="Your name">
                  <span class="form-error" id="error-contact-name" role="alert"></span>
                </div>
                <div class="form-group">
                  <label class="form-label" for="contact-email">Email <span class="form-required">*</span></label>
                  <input type="email" id="contact-email" name="email" class="form-input" required autocomplete="email" placeholder="your@email.com">
                  <span class="form-error" id="error-contact-email" role="alert"></span>
                </div>
                <div class="form-group">
                  <label class="form-label" for="contact-enquiry">Enquiry type <span class="form-required">*</span></label>
                  <select id="contact-enquiry" name="enquiryType" class="form-input" required>
                    <option value="">— Select —</option>
                    <option value="General Enquiry">General Enquiry</option>
                    <option value="MyAccount & Contact Pages">MyAccount & Contact Pages</option>
                    <option value="Website & Technical Support">Website & Technical Support</option>
                    <option value="Privacy & Data">Privacy & Data</option>
                    <option value="Feedback, Suggestions & Complaints">Feedback, Suggestions & Complaints</option>
                  </select>
                  <span class="form-error" id="error-contact-enquiry" role="alert"></span>
                </div>
                <div class="form-group">
                  <label class="form-label" for="contact-message">Message <span class="form-required">*</span></label>
                  <textarea id="contact-message" name="message" class="form-input form-textarea" required rows="5" maxlength="5000" placeholder="Your message"></textarea>
                  <span class="form-error" id="error-contact-message" role="alert"></span>
                </div>
                <div class="form-actions">
                  <button type="submit" id="contact-submit" class="btn btn-primary btn-lg">Send message</button>
                </div>
              </form>
            </div>

            <div id="contact-confirm" class="contact-confirm" role="alert"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
  (function() {
    const API = 'https://contact-page-editor.deem0u.workers.dev';
    const form = document.getElementById('contact-form');
    const confirmEl = document.getElementById('contact-confirm');
    const formWrap = document.getElementById('contact-form-wrap');
    const submitBtn = document.getElementById('contact-submit');

    function showConfirm(message, isError) {
      confirmEl.textContent = message;
      confirmEl.className = 'contact-confirm ' + (isError ? 'error' : 'success');
      confirmEl.style.display = 'block';
    }

    function clearErrors() {
      ['contact-name', 'contact-email', 'contact-enquiry', 'contact-message'].forEach(function(id) {
        var err = document.getElementById('error-' + id);
        if (err) err.textContent = '';
        var inp = document.getElementById(id);
        if (inp) inp.classList.remove('is-invalid');
      });
    }

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      clearErrors();
      confirmEl.style.display = 'none';

      var name = (document.getElementById('contact-name').value || '').trim();
      var email = (document.getElementById('contact-email').value || '').trim();
      var enquiryType = (document.getElementById('contact-enquiry').value || '').trim();
      var message = (document.getElementById('contact-message').value || '').trim();

      if (!name) {
        document.getElementById('error-contact-name').textContent = 'Name is required.';
        document.getElementById('contact-name').classList.add('is-invalid');
        return;
      }
      if (!email) {
        document.getElementById('error-contact-email').textContent = 'Email is required.';
        document.getElementById('contact-email').classList.add('is-invalid');
        return;
      }
      if (!enquiryType) {
        document.getElementById('error-contact-enquiry').textContent = 'Please select an enquiry type.';
        document.getElementById('contact-enquiry').classList.add('is-invalid');
        return;
      }
      if (!message) {
        document.getElementById('error-contact-message').textContent = 'Message is required.';
        document.getElementById('contact-message').classList.add('is-invalid');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending…';

      try {
        var res = await fetch(API + '/api/contact', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name, email: email, enquiryType: enquiryType, message: message })
        });
        var data = await res.json().catch(function() { return {}; });

        if (res.ok && data.success) {
          form.reset();
          showConfirm('Thank you. Your message has been sent successfully. We will get back to you as soon as we can.', false);
        } else {
          showConfirm(data.error || 'Something went wrong. Please try again later.', true);
        }
      } catch (err) {
        showConfirm('Unable to send message. Please check your connection and try again.', true);
      }

      submitBtn.disabled = false;
      submitBtn.textContent = 'Send message';
    });
  })();
  </script>
</body>
</html>
